<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Access</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#ffccd5,#ffe6f0,#f3e8ff);
}

.lockBox{
  background:white;
  padding:30px;
  width:320px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

h2{ margin-top:0; }

input{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:12px;
  margin-top:14px;
  border:none;
  border-radius:10px;
  background:#ff7aa2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#error{
  color:red;
  height:18px;
  margin-top:8px;
  font-size:14px;
}
</style>

</head>

<body>

<div class="lockBox">
  <h2>🎁 Private Birthday Surprise</h2>
  <p>Enter your birthday</p>

  <input id="pass" type="text" placeholder="DDMM (example: 0903)">
  <button onclick="check()">Unlock</button>

  <div id="error"></div>
</div>

<script>

// ================= ALLOWED BIRTHDAYS (DDMM) =================
const BIRTHDAYS = [
  "0903",
  "1207",
  "2211",
  "1508",
  "0101"
];

// convert user input → DDMM
function normalizeBirthday(input){

  input = input.trim();

  // remove separators like / - .
  input = input.replace(/[-\/.]/g,'');

  // 8 digit date (09032004)
  if(input.length === 8){
    return input.slice(0,4);
  }

  // 3 digit (903 -> 0903)
  if(input.length === 3){
    return "0" + input;
  }

  return input;
}

function check(){

  let value = document.getElementById("pass").value;
  value = normalizeBirthday(value);

  if(BIRTHDAYS.includes(value)){

    // allow this session only
    sessionStorage.setItem("birthday_access","granted");
    sessionStorage.setItem("visitor_bday", value);

    window.location.href = "index.html";

  }else{
    document.getElementById("error").textContent =
      "Enter birthday in DDMM format";
  }
}

// press Enter to unlock
document.getElementById("pass").addEventListener("keydown", e=>{
  if(e.key==="Enter") check();
});

</script>

</body>
</html>
