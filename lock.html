<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Access</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#ffccd5,#ffe6f0,#f3e8ff);
}

.lockBox{
  background:white;
  padding:30px;
  width:320px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

h2{ margin-top:0; }

input{
  width:100%;
  padding:12px;
  margin-top:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:12px;
  margin-top:14px;
  border:none;
  border-radius:10px;
  background:#ff7aa2;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#error{
  color:red;
  height:18px;
  margin-top:8px;
  font-size:14px;
}
</style>

</head>

<body>

<div class="lockBox">
  <h2>🎁 Private Birthday Surprise</h2>
  <p>Enter your birthday (DDMMYYYY)</p>

  <input id="pass" type="password" placeholder="Example: 09032005">
  <button onclick="check()">Unlock</button>

  <div id="error"></div>
</div>

<script>

// ===== ALLOWED FULL DATES =====
const BIRTHDAYS = [
  "09032005",
  "12072004",
  "22112003",
  "15082005",
  "01012004"
];

// normalize input → DDMMYYYY
function normalizeBirthday(input){

  input = input.trim();

  // remove separators / - .
  input = input.replace(/[-\/.]/g,'');

  // must be 8 digits
  if(input.length !== 8) return null;

  return input;
}

function check(){

  let value = document.getElementById("pass").value;
  value = normalizeBirthday(value);

  if(value && BIRTHDAYS.includes(value)){

    sessionStorage.setItem("birthday_access","granted");
    sessionStorage.setItem("visitor_bday", value);

    window.location.href = "index.html";

  }else{
    document.getElementById("error").textContent =
      "Wrong birthday format or not allowed";
  }
}

// Enter key unlock
document.getElementById("pass").addEventListener("keydown", e=>{
  if(e.key==="Enter") check();
});

</script>

</body>
</html>
